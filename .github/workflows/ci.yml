name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # Version aus "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint = ESLint (inkl. Regel N1), Prettier, Paketgrenzen (A3), Lizenzprüfung (C5), Clean-Room (C2).
      # Das typgestützte ESLint über alle Projekte braucht seit Welle 6 etwa 5 GB, mehr als der Standard-Heap von Node auf dem
      # Runner (etwa 4 GB); derselbe Wert wie im Befehl der Regeln und Tickets.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: pnpm typecheck
      - run: pnpm test

      # GAEB-Exporte gegen das amtliche XSD (ADR 0010, Q3). Das Schema wird zur Laufzeit geladen (SHA-256 geprüft)
      # und nie versioniert; das Skript schlägt auch fehl, wenn ein *.xsd im Repo liegt.
      - name: GAEB XSD-Gegenprüfung
        run: |
          command -v xmllint >/dev/null || (sudo apt-get update && sudo apt-get install -y libxml2-utils)
          pnpm --filter @tethys/gaeb run xsd-gegenpruefung

      - run: pnpm --filter @tethys/web exec playwright install --with-deps chromium
      - run: pnpm e2e

      - name: REUSE-Lint
        run: |
          pip install reuse
          reuse lint

      - name: DCO (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
        run: node tools/check-dco.mjs "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" "$PR_AUTOR"
