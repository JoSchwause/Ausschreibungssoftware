version = 1
SPDX-PackageName = "Tethys AVA"

# Ein Eintrag für das ganze Repo (ADR 0008): jede Datei ist AGPL-3.0-or-later, auch ohne Dateikopf.
# Spätere Einträge schlagen frühere; deshalb stehen Ausnahmen unter diesem Block.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Tethys AVA contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# ---------------------------------------------------------------------------------------------
# Ausnahmen je Pfad: HIER eintragen (z. B. Dateien Dritter unter fixtures/extern/, Regel C4).
# Jeder Eintrag braucht `precedence = "override"`, den Urheber und die Lizenz, und die Lizenz
# muss mit `reuse download <ID>` unter LICENSES/ liegen und AGPL-3.0-or-later-kompatibel sein.
# Beispiel:
#
# [[annotations]]
# path = "fixtures/extern/**"
# precedence = "override"
# SPDX-FileCopyrightText = "Urheber laut Herkunftsvermerk"
# SPDX-License-Identifier = "CC-BY-4.0"
# ---------------------------------------------------------------------------------------------

# Amtliche BVBS-Prüfdateien und GAEB-Musterdateien (Ticket 23, G-55 Nr. 1): keine Lizenz genannt, unverändert
# übernommen, Text unter LICENSES/. Herkunft je Datei: fixtures/extern/HERKUNFT.md.
[[annotations]]
path = ["fixtures/extern/bvbs/**", "fixtures/extern/gaeb/**"]
precedence = "override"
SPDX-FileCopyrightText = "BVBS e.V. und GAEB (Herausgeber der amtlichen Prüf- und Musterdateien), keine Lizenz genannt"
SPDX-License-Identifier = "LicenseRef-BVBS-GAEB-Pruefdatei"

# Schriftdateien der PDF-Ausgabe (Ticket 28): Noto Sans, Latin-Teilmenge als WOFF, aus dem npm-Paket
# @fontsource/noto-sans 5.3.0 (Dateien files/noto-sans-latin-{400,700}-normal.woff). Lizenz laut LICENSE des Pakets:
# SIL Open Font License 1.1, Urheber laut dessen Kopfzeile "The Noto Project Authors". Die Dateien liegen so vor,
# wie das Paket sie liefert (Fontsource hat die Latin-Teilmenge aus den Noto-Quellen erzeugt; wir ändern nichts
# daran). Das npm-Paket selbst ist keine Abhängigkeit; die Lizenzprüfung (tools/licenses.mjs) sieht nur Pakete.
[[annotations]]
path = "packages/ausgabe/schriften/*.woff"
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/latin-greek-cyrillic)"
SPDX-License-Identifier = "OFL-1.1"
